<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f0fa;
            color: #4c2f66;
            overflow: hidden;
        }

        .doodle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('1000029461.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            mix-blend-mode: multiply;
            z-index: 1;
            transform: scale(1.02);
            animation: backgroundDrift 40s ease-in-out infinite alternate;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.25) 0%, rgba(244, 239, 250, 0.4) 50%, rgba(157, 78, 221, 0.2) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 170, 255, 0.4) 0%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }
        .orb-1 { top: -10%; left: -10%; }
        .orb-2 { bottom: -10%; right: -10%; animation-delay: -5s; }

        .enter-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #240046 0%, #3c096c 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 1.5s;
            cursor: pointer;
        }

        .enter-gate::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('1000029461.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            mix-blend-mode: overlay;
        }

        .enter-btn {
            position: relative;
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: #e0aaff;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            text-shadow: 0 0 20px rgba(224, 170, 255, 0.4);
            animation: pulseText 2s ease-in-out infinite;
        }

        .enter-sub {
            position: relative;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #c77dff;
            margin-top: 10px;
        }

        .workspace {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 2s cubic-bezier(0.25, 1, 0.5, 1), transform 2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .workspace.active {
            opacity: 1;
            transform: scale(1);
        }

        .scrap-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 700px;
        }

        .profile-polaroid {
            position: absolute;
            top: 12%;
            left: 8%;
            background: #fff;
            padding: 16px 16px 24px 16px;
            box-shadow: 0 15px 35px rgba(58, 12, 163, 0.12);
            transform: rotate(-4deg);
            border-radius: 2px;
            width: 210px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(123, 44, 191, 0.1);
            animation: floatCard 6s ease-in-out infinite alternate;
        }

        .polaroid-img-wrapper {
            position: relative;
            width: 176px;
            height: 176px;
            background: #f3ebfa;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .polaroid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid-caption {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #3c096c;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #747f8d;
            flex-shrink: 0;
            display: inline-block;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .quote-card {
            position: absolute;
            top: 42%;
            left: 32%;
            width: 48%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px dashed rgba(123, 44, 191, 0.3);
            box-shadow: 0 20px 45px rgba(90, 24, 154, 0.08);
            transform: rotate(2deg);
            border-radius: 12px;
            animation: floatCard 7s ease-in-out infinite alternate-reverse;
            z-index: 4;
        }

        .quote-text {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 2.1rem;
            line-height: 1.35;
            color: #240046;
            margin-bottom: 15px;
        }

        .quote-author {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #7b2cbf;
            text-align: right;
        }

        .vinyl-player {
            position: absolute;
            top: 8%;
            right: 8%;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(123, 44, 191, 0.1);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .disc {
            width: 40px;
            height: 40px;
            background: #1a0033;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: spin 4s linear infinite;
        }

        .disc::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #f6f0fa;
            border-radius: 50%;
        }

        .track-details h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #240046;
        }

        .track-details p {
            font-size: 0.75rem;
            color: #7b2cbf;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .sticker-link {
            position: absolute;
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: #240046;
            text-decoration: none;
            padding: 12px 28px;
            background: #fff;
            box-shadow: 3px 6px 18px rgba(123, 44, 191, 0.12);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(123, 44, 191, 0.1);
            border-radius: 4px;
        }

        .sticker-link::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 30%;
            width: 40%;
            height: 16px;
            background: rgba(224, 170, 255, 0.3);
            backdrop-filter: blur(1px);
            border-left: 1px dashed rgba(123, 44, 191, 0.15);
            border-right: 1px dashed rgba(123, 44, 191, 0.15);
            transform: rotate(-1deg);
        }

        .link-instagram {
            bottom: 12%;
            right: 28%;
            transform: rotate(3deg);
            background: #fff0f5;
        }

        .link-discord {
            bottom: 25%;
            right: 8%;
            transform: rotate(-5deg);
            background: #f0f3fa;
        }

        .sticker-link:hover {
            transform: scale(1.08) translateY(-5px) rotate(0deg);
            box-shadow: 5px 15px 28px rgba(123, 44, 191, 0.2);
            z-index: 10;
        }

        .decor {
            position: absolute;
            pointer-events: none;
            font-family: 'Caveat', cursive;
            color: rgba(123, 44, 191, 0.4);
            user-select: none;
        }

        @keyframes backgroundDrift {
            0% { transform: scale(1.02) translate(0px, 0px) rotate(0deg); }
            50% { transform: scale(1.05) translate(-8px, 5px) rotate(0.3deg); }
            100% { transform: scale(1.02) translate(4px, -4px) rotate(-0.3deg); }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotate(-4deg); }
            100% { transform: translateY(-10px) rotate(-1deg); }
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .profile-polaroid {
                position: relative;
                top: auto; left: auto;
                margin: 0 auto 20px;
                transform: rotate(-2deg);
            }
            .quote-card {
                position: relative;
                top: auto; left: auto;
                width: 100%;
                margin-bottom: 30px;
                padding: 25px;
            }
            .quote-text { font-size: 1.6rem; }
            .vinyl-player { position: relative; top: auto; right: auto; margin-bottom: 20px; justify-content: center; }
            .scrap-container { height: auto; max-height: none; display: flex; flex-direction: column; align-items: center; }
            .workspace { overflow-y: auto; align-items: flex-start; padding-top: 40px; }
            .sticker-link { position: relative; bottom: auto; right: auto; margin: 10px 0; display: inline-block; width: 80%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="doodle-bg"></div>
    <div class="overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="enter-gate" id="enterGate" onclick="initBeatopia()">
        <button class="enter-btn">:3</button>
        <div class="enter-sub">click</div>
    </div>

    <main class="workspace" id="mainWorkspace">
        <div class="scrap-container">
            
            <div class="vinyl-player">
                <div class="disc"></div>
                <div class="track-details">
                    <h4>Fairy Songs</h4>
                    <p>Beabadoobee</p>
                </div>
            </div>

            <div class="profile-polaroid">
                <div class="polaroid-img-wrapper">
                    <img class="polaroid-img" id="avatarImg" src="https://via.placeholder.com/176" alt="Profile Picture">
                </div>
                <div class="polaroid-caption">
                    <span id="usernameText">Cey</span>
                    <div class="status-dot" id="statusDot"></div>
                </div>
            </div>

            <article class="quote-card">
                <div class="quote-text">“Nostalgia is the most merciful form of grief.“</div>
                <div class="quote-author">— Cey</div>
            </article>

            <div class="decor" style="top: 15%; left: 35%; font-size: 2rem;">★</div>
            <div class="decor" style="bottom: 38%; left: 15%; font-size: 2.2rem; transform: rotate(-15deg);">pictures of us</div>
            <div class="decor" style="bottom: 8%; left: 5%; font-size: 1.6rem;">ripples...</div>

            <nav style="display: contents;">
                <a href="https://discord.com/users/921560030698950656" target="_blank" rel="noopener" class="sticker-link link-discord" id="discordLink">
                    discord profile ↗
                </a>
                <a href="https://www.instagram.com/4ucyee?igsh=c2Y2enl5anoxbmpq" target="_blank" rel="noopener" class="sticker-link link-instagram">
                    ig: @4ucyee
                </a>
            </nav>

        </div>
    </main>

    <audio id="beatopiaAudio" loop>
        <source src="Beabadoobee - fairy song (Lyrics).mp3" type="audio/mpeg">
    </audio>

    <script>
        function initBeatopia() {
            const gate = document.getElementById('enterGate');
            const workspace = document.getElementById('mainWorkspace');
            const audio = document.getElementById('beatopiaAudio');
            
            audio.play().catch(function(error) {
                console.log("Audio integration framework initialized on click transaction block.");
            });
            
            gate.style.opacity = '0';
            gate.style.visibility = 'hidden';
            workspace.classList.add('active');
        }

        async function fetchDiscordPresence() {
            try {
                const response = await fetch('https://api.lanyard.rest/v1/users/921560030698950656');
                const result = await response.json();
                
                if (result.success && result.data) {
                    const status = result.data.discord_status;
                    const statusDot = document.getElementById('statusDot');
                    const usernameText = document.getElementById('usernameText');
                    const avatarImg = document.getElementById('avatarImg');
                    
                    let colors = {
                        online: '#43b581',
                        idle: '#faa61a',
                        dnd: '#f04747',
                        offline: '#747f8d'
                    };
                    
                    let activeColor = colors[status] || colors.offline;
                    statusDot.style.backgroundColor = activeColor;
                    statusDot.style.boxShadow = `0 0 10px ${activeColor}`;
                    
                    if (result.data.discord_user && result.data.discord_user.avatar) {
                        const animated = result.data.discord_user.avatar.startsWith('a_');
                        const ext = animated ? 'gif' : 'png';
                        avatarImg.src = `https://cdn.discordapp.com/avatars/921560030698950656/${result.data.discord_user.avatar}.${ext}?size=256`;
                    }
                }
            } catch (error) {
                console.log("Presence resolution pipeline encountered expected interruption context.");
            }
        }

        fetchDiscordPresence();
        setInterval(fetchDiscordPresence, 30000);
    </script>
</body>
</html>
