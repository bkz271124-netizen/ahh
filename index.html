<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>STEM-ENGTECH-3-REGULAR | Dashboard</title>
  <style>
    :root {
      --clr-bg-start: #3a0000;
      --clr-bg-end: #0a0000;
      --clr-glass-bg: rgba(255, 255, 255, 0.08);
      --clr-glass-border: rgba(255, 255, 255, 0.15);
      --clr-accent: #e74c3c;
      --clr-accent-hover: #c0392b;
      --clr-text: #f0f0f0;
      --clr-text-muted: rgba(255, 255, 255, 0.6);
      --sidebar-width: 250px;
      --topbar-height: 56px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, var(--clr-bg-start), var(--clr-bg-end));
      min-height: 100vh;
      color: var(--clr-text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-right: 1px solid var(--clr-glass-border);
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 20;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 0 1.5rem 1.5rem;
      border-bottom: 1px solid var(--clr-glass-border);
      margin-bottom: 1rem;
    }

    .sidebar-logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--clr-accent);
      line-height: 1.2;
    }

    .sidebar-logo small {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--clr-text-muted);
      letter-spacing: 1px;
    }

    .nav-list {
      list-style: none;
      padding: 0 0.75rem;
      flex: 1;
    }

    .nav-item {
      margin-bottom: 0.3rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-radius: 0.75rem;
      color: var(--clr-text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .nav-link.active {
      background: rgba(231, 76, 60, 0.2);
      color: var(--clr-accent);
      font-weight: 600;
    }

    .nav-icon {
      font-size: 1.3rem;
      width: 1.5rem;
      text-align: center;
    }

    /* Main content area */
    .main {
      flex: 1;
      margin-left: var(--sidebar-width);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: var(--topbar-height);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--clr-glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      font-weight: 700;
      font-size: 1.2rem;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .dashboard {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .glass-card {
      background: var(--clr-glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--clr-glass-border);
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--clr-text);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 1px solid var(--clr-glass-border);
      padding-bottom: 0.5rem;
    }

    .stat-grid {
      grid-column: span 3;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.5rem;
    }

    .stat-card {
      text-align: center;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--clr-accent);
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--clr-text-muted);
      margin-top: 0.2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--clr-glass-border);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }

    select:focus, textarea:focus {
      border-color: var(--clr-accent);
      background: rgba(255, 255, 255, 0.15);
    }

    select option {
      background: #2a0a0a;
      color: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 1rem;
      background: var(--clr-accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover:not(:disabled) {
      background: var(--clr-accent-hover);
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 1rem;
      font-weight: 500;
      text-align: center;
    }

    .feedback.success { color: #b9f5b0; }
    .feedback.error { color: #ffaaaa; }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        position: fixed;
        height: 100%;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: block;
      }
      .dashboard {
        padding: 1rem;
        grid-template-columns: 1fr;
      }
      .stat-grid {
        grid-column: span 1;
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 0 1rem;
      }
      .stat-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          OLFU
          <small>STEM-ENGTECH-3-REGULAR</small>
        </div>
      </div>
      <ul class="nav-list">
        <li class="nav-item">
          <a class="nav-link active" data-page="dashboard" href="#">&#9632; Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="submit" href="#">&#9998; Submit Concern</a>
        </li>
      </ul>
      <div style="padding: 1rem; margin-top: auto; font-size: 0.7rem; color: var(--clr-text-muted); text-align: center;">
        &copy; 2026/2027 class dashboard made by braeden
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div></div>
      </header>

      <div class="dashboard" id="dashboardContent">
        <!-- Stat cards row -->
        <div class="stat-grid">
          <div class="glass-card stat-card">
            <div class="stat-value" id="totalSubmissions">0</div>
            <div class="stat-label">Total Submissions</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-value" id="todaySubmissions">0</div>
            <div class="stat-label">Today</div>
          </div>
          <div class="glass-card stat-card">
            <div class="stat-value" id="lastSubmissionTime">--</div>
            <div class="stat-label">Last Submission</div>
          </div>
        </div>

        <!-- Submit form card -->
        <div class="glass-card" id="submitCard" style="grid-column: span 2;">
          <div class="card-title">&#9998; Submit a Concern</div>
          <form id="reportForm">
            <div class="form-group">
              <div class="radio-group">
                <label>
                  <input type="radio" name="identity" value="named" checked> Identify Yourself
                </label>
                <label>
                  <input type="radio" name="identity" value="anonymous"> Remain Anonymous
                </label>
              </div>
            </div>
            <div class="form-group" id="nameDropdownGroup">
              <select id="studentName" required>
                <option value="">-- Select your name --</option>
              </select>
            </div>
            <div class="form-group">
              <textarea id="concern" placeholder="Type your concern here..." required></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">Submit Report</button>
            <div class="feedback" id="feedback"></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const students = [
        "ANGELES, ADRIAN MARTIN P.",
        "ARCILLA, FRANCIS JR. S.",
        "BA-OY, RYAN JR. A.",
        "BONDOC, JAREN P.",
        "BUAN, LANCE GABRIEL Y.",
        "CAPATI, MIGGY",
        "CASTINO, JEFFERSON C.",
        "DE PEDRO, AVERREE VON I.",
        "DELA CRUZ, TRIXIE NICOLE V.",
        "DIMALANTA, RADLEY C.",
        "ESCUREL, JOSE RUBEN L.",
        "ESPIRITU, PRINCESS LIANN M.",
        "EVANGELIO, GERALD",
        "FERNANDEZ, DANIEL KHERBY S.",
        "FLORES, DENISE CLAIRE P.",
        "GABANIE, JENNALYN T.",
        "GALANG, MIKE CYRUSS P.",
        "GENOVA, RALPH LAURENCE D.",
        "GOPEZ, JOHN CHRISTIAN P.",
        "GOPIAO, KLEINNIOUR ELVANNIEL LAIR G.",
        "GUEVARRA, JOHN CHRISTIAN L.",
        "ISIDRO, RANZEL CLYDE R.",
        "LAZARO, JELHIAN ANDREI S.",
        "MATIAS, AARON NIGEL P.",
        "MATILLA, NEIL G.",
        "MONTAYRE, CARL MICHEAL M.",
        "MONTOJO, CHARMAIGNE GAIL T.",
        "MURALLA, JOMARI M.",
        "OCHOA, ENICA SHEZEN B.",
        "ORTIGUERRA, TRISTAN JACOB A.",
        "OSERA, ZACH RIAH T.",
        "PANGILINAN, ELANE CRIS B.",
        "PINCAS, JOMER R.",
        "SANURY, TIMIETY F.",
        "SIRON, BRAEDEN KURT ZAIJIAN V.",
        "TABULINAR, DANE JUZELL L.",
        "TAMBIS, WESLEY ROI",
        "TENORIO, ALDREI JAZZ",
        "TENORIO, ALDRICH JAMEER M.",
        "VILLANUEVA, LEANNE ROSE T."
      ].sort((a, b) => a.localeCompare(b));

      const WEBHOOK_URL = 'https://discord.com/api/webhooks/1530487578699239496/hCc-xgu6dnGawpfSRau8AqIqV-M9JjpqfOnhHqbBH0EIXqfbyteVU7uFJQ9Vkhne9MkJ';

      const form = document.getElementById('reportForm');
      const identityRadios = document.getElementsByName('identity');
      const studentSelect = document.getElementById('studentName');
      const concernTextarea = document.getElementById('concern');
      const submitBtn = document.getElementById('submitBtn');
      const feedbackDiv = document.getElementById('feedback');
      const totalSubEl = document.getElementById('totalSubmissions');
      const todaySubEl = document.getElementById('todaySubmissions');
      const lastTimeEl = document.getElementById('lastSubmissionTime');

      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menuToggle');
      const pageTitle = document.getElementById('pageTitle');

      // Populate student dropdown
      students.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        studentSelect.appendChild(opt);
      });

      function updateNameFieldState() {
        const isAnonymous = document.querySelector('input[name="identity"]:checked').value === 'anonymous';
        studentSelect.disabled = isAnonymous;
        studentSelect.required = !isAnonymous;
        if (isAnonymous) studentSelect.value = '';
      }
      identityRadios.forEach(r => r.addEventListener('change', updateNameFieldState));
      updateNameFieldState();

      // LocalStorage for stats only (no recent reports)
      const STORAGE_KEY_STATS = 'olfuReportStats';

      function loadStats() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_STATS);
          return raw ? JSON.parse(raw) : { total: 0, todayCount: 0, todayDate: '', lastTimestamp: null };
        } catch (e) {
          return { total: 0, todayCount: 0, todayDate: '', lastTimestamp: null };
        }
      }

      function saveStats(stats) {
        localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(stats));
      }

      function updateStatsAfterSubmit() {
        let stats = loadStats();
        const today = new Date().toDateString();

        if (stats.todayDate !== today) {
          stats.todayCount = 1;
          stats.todayDate = today;
        } else {
          stats.todayCount += 1;
        }
        stats.total += 1;
        stats.lastTimestamp = Date.now();
        saveStats(stats);
        renderStats();
      }

      function renderStats() {
        const stats = loadStats();
        totalSubEl.textContent = stats.total;
        todaySubEl.textContent = stats.todayCount;

        if (stats.lastTimestamp) {
          const d = new Date(stats.lastTimestamp);
          lastTimeEl.textContent = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
        } else {
          lastTimeEl.textContent = '--';
        }
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedbackDiv.textContent = '';
        feedbackDiv.className = 'feedback';

        const identity = document.querySelector('input[name="identity"]:checked').value;
        const concern = concernTextarea.value.trim();
        if (!concern) {
          feedbackDiv.textContent = 'Please enter your concern.';
          feedbackDiv.className = 'feedback error';
          return;
        }

        let reporterName;
        if (identity === 'anonymous') {
          reporterName = 'Anonymous';
        } else {
          reporterName = studentSelect.value;
          if (!reporterName) {
            feedbackDiv.textContent = 'Please select your name.';
            feedbackDiv.className = 'feedback error';
            return;
          }
        }

        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
        const timeStr = now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        const dateTimeStr = `${dateStr} at ${timeStr}`;

        const embed = {
          title: 'New Concern Report',
          description: `**Name:** ${reporterName}\n**Date & Time:** ${dateTimeStr}\n**Concern:**\n${concern}`,
          color: 16711680, // red
          footer: {
            text: 'STEM-ENGTECH-3-REGULAR | Our Lady of Fatima University'
          }
        };

        const payload = { content: null, embeds: [embed] };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
          const response = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            updateStatsAfterSubmit();

            feedbackDiv.textContent = 'Report submitted successfully. Thank you.';
            feedbackDiv.className = 'feedback success';
            form.reset();
            updateNameFieldState();
            concernTextarea.value = '';

            setTimeout(() => {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit Report';
            }, 5000);
          } else {
            const errText = await response.text();
            throw new Error(`Status ${response.status}: ${errText}`);
          }
        } catch (err) {
          console.error(err);
          feedbackDiv.textContent = 'Failed to send report. Please try again later.';
          feedbackDiv.className = 'feedback error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Report';
        }
      });

      // Navigation (only Dashboard and Submit Concern remain)
      function setActivePage(page) {
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-link[data-page="${page}"]`);
        if (activeLink) activeLink.classList.add('active');

        const titles = { dashboard: 'Dashboard', submit: 'Submit Concern' };
        pageTitle.textContent = titles[page] || 'Dashboard';

        if (page === 'submit') {
          document.getElementById('submitCard').scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        if (window.innerWidth <= 900) {
          sidebar.classList.remove('open');
        }
      }

      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const page = link.getAttribute('data-page');
          if (page) setActivePage(page);
        });
      });

      menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (window.innerWidth <= 900 && !sidebar.contains(e.target) && e.target !== menuToggle) {
          sidebar.classList.remove('open');
        }
      });

      // Initial render
      renderStats();
      setActivePage('dashboard');

      window.addEventListener('resize', () => {
        if (window.innerWidth > 900) {
          sidebar.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
